
<!DOCTYPE html>
<html>
<head>
    <title>Sorting Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Number Sorting Game</h1>

    <p>Drag and drop the items into the correct order</p>

    <div class="sorting-list" id="sortingList">

        <div class="item">
            <div class="number">1</div>
            <div class="item-name" draggable="true">Item 3</div>
           
        </div>

        <div class="item">
            <div class="number">2</div>
            <div class="item-name" draggable="true">Item 1</div>
        </div>

        <div class="item">
            <div class="number">3</div>
            <div class="item-name" draggable="true">Item 5</div>
    
        </div>

        <div class="item">
            <div class="number">4</div>
            <div class="item-name" draggable="true">Item 2</div>
           
        </div>

        <div class="item">
            <div class="number">5</div>
            <div class="item-name" draggable="true">Item 4</div>
        
        </div>

    </div>

    <button id="checkButton">Check Order ➤</button>

    <p id="message"></p>

    <script src="script.js"></script>
</body>
</html>
